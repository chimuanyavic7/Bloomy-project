
services:
  nginx:
    image: nginx:alpine
    container_name: bloomy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/current.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - bloomy-network
    depends_on:
      - java
      - myportfolio

  java:
    image: ${DOCKERHUB_USERNAME}/bloomy-java:${IMAGE_TAG}
    container_name: bloomy-java
    restart: unless-stopped
    expose:
      - "8081"
    networks:
      - bloomy-network

  myportfolio:
    image: ${DOCKERHUB_USERNAME}/bloomy-myportfolio:${IMAGE_TAG}
    container_name: bloomy-myportfolio
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - bloomy-network

networks:
  bloomy-network:
    driver: bridge
