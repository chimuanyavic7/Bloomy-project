
# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name vikkychi.site www.vikkychi.site app.vikkychi.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend - HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name vikkychi.site www.vikkychi.site;

    ssl_certificate /etc/letsencrypt/live/vikkychi.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vikkychi.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://myportfolio:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Java Backend - HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name app.vikkychi.site;

    ssl_certificate /etc/letsencrypt/live/vikkychi.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vikkychi.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://java:8081;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
