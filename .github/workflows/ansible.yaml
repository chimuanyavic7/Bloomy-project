name: Ansible Configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-ec2:
    name: Configure EC2 with Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Prepare SSH Key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu

          test -n "$EC2_SSH_KEY" || {
            echo "ERROR: EC2_SSH_KEY is empty."
            exit 1
          }

          install -m 600 /dev/null "$RUNNER_TEMP/ec2_key"
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2_key"

      - name: Generate Ansible Inventory
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -eu

          test -n "$EC2_HOST" || {
            echo "ERROR: EC2_HOST is empty."
            exit 1
          }

          test -n "$EC2_USER" || {
            echo "ERROR: EC2_USER is empty."
            exit 1
          }

          cat > ansible/inventory.ini <<EOF
          [webservers]
          $EC2_HOST

          [webservers:vars]
          ansible_user=$EC2_USER
          ansible_ssh_private_key_file=$RUNNER_TEMP/ec2_key
          EOF

      - name: Test Ansible Connectivity
        run: |
          ansible webservers \
            -i ansible/inventory.ini \
            -m ping \
            --timeout 10

      - name: Run Ansible Playbook
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml

      - name: Clean Up SSH Key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/ec2_key"