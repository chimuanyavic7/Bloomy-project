
name: Terraform Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"

  workflow_dispatch:
    inputs:
      action:
        description: "Select Terraform Action"
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read
  actions: write
  variables: write

jobs:
  terraform:
    name: "Provision AWS Infrastructure"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Verify Tool Versions
        run: |
          set -eux
          terraform version
          aws --version
          gh --version

      - name: Verify Terraform Variables File
        run: |
          set -euo pipefail
          if [[ ! -f dev.tfvars ]]; then
            echo "ERROR: terraform/dev.tfvars was not found"
            exit 1
          fi

      - name: Terraform Init
        run: |
          set -euxo pipefail
          terraform init -input=false

      - name: Terraform Validate
        run: |
          set -euxo pipefail
          terraform validate

      - name: Determine Terraform Action
        id: set-action
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            ACTION="apply"
          else
            ACTION="${INPUT_ACTION:-apply}"
          fi

          if [[ "$ACTION" != "apply" && "$ACTION" != "destroy" ]]; then
            echo "Invalid Terraform action: $ACTION"
            exit 1
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Selected Terraform action: $ACTION"

      
      - name: Terraform Plan
        env:
          ACTION: ${{ steps.set-action.outputs.action }}
        run: |
          set -euo pipefail

          if [[ "$ACTION" == "destroy" ]]; then
            terraform plan \
              -destroy \
              -var-file="dev.tfvars" \
              -input=false \
              -out=tfplan
          else
            terraform plan \
              -var-file="dev.tfvars" \
              -input=false \
              -out=tfplan
          fi

      - name: Run Terraform Apply or Destroy
        env:
          ACTION: ${{ steps.set-action.outputs.action }}
        run: |
          set -euo pipefail

          echo "Executing Terraform action: $ACTION"

          if [[ "$ACTION" == "destroy" ]]; then
            terraform show -no-color tfplan
          fi

          terraform apply -input=false -auto-approve tfplan

      - name: Update or Clear GitHub Repository Variable
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ steps.set-action.outputs.action }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$ACTION" == "apply" ]]; then
            INSTANCE_IP=$(terraform output -raw instance_public_ip)

            if [[ -z "$INSTANCE_IP" ]]; then
              echo "ERROR: Terraform returned an empty instance_public_ip"
              exit 1
            fi

            echo "EC2 public IP: $INSTANCE_IP"

            gh variable set EC2_HOST \
              --repo "$REPOSITORY" \
              --body "$INSTANCE_IP"

            echo "Successfully updated EC2_HOST."
          else
            echo "Infrastructure destroyed. Removing EC2_HOST..."

            gh variable delete EC2_HOST \
              --repo "$REPOSITORY" || true

            echo "EC2_HOST cleanup completed."
          fi
