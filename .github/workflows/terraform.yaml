name: Terraform Infrastructure

on:

  workflow_dispatch:
    inputs:
      action:
        description: "Select Terraform Action"
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read
  actions: write

# Prevent simultaneous Terraform operations against the same state.
concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    name: Provision AWS Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Verify Terraform Variables File
        shell: bash
        run: |
          set -euo pipefail
          test -f dev.tfvars || {
            echo "ERROR: terraform/dev.tfvars was not found"
            exit 1
          }

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Determine Terraform Action
        id: set-action
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            ACTION="apply"
          else
            ACTION="${INPUT_ACTION:-apply}"
          fi

          if [[ "$ACTION" != "apply" && "$ACTION" != "destroy" ]]; then
            echo "ERROR: Invalid Terraform action: $ACTION"
            exit 1
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Selected action: $ACTION"

      - name: Create Terraform Plan
        env:
          ACTION: ${{ steps.set-action.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$ACTION" == "destroy" ]]; then
            terraform plan \
              -destroy \
              -var-file="dev.tfvars" \
              -input=false \
              -out=tfplan
          else
            terraform plan \
              -var-file="dev.tfvars" \
              -input=false \
              -out=tfplan
          fi

      - name: Show Terraform Plan
        run: terraform show -no-color tfplan

      - name: Apply Terraform Plan
        env:
          ACTION: ${{ steps.set-action.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$ACTION" == "destroy" ]]; then
            echo "Destroying Terraform-managed infrastructure..."
          else
            echo "Applying Terraform infrastructure changes..."
          fi

          terraform apply -input=false tfplan

      
      
      - name: Update or Clear GitHub Repository Variable
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ACTION: ${{ steps.set-action.outputs.action }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$ACTION" == "apply" ]]; then
            INSTANCE_IP="$(terraform output -raw instance_public_ip)"

            if [[ -z "$INSTANCE_IP" ]]; then
              echo "ERROR: Empty instance_public_ip output"
              exit 1
            fi

            # Save the current Terraform IP in GitHub.
            gh variable set EC2_HOST \
              --repo "$REPOSITORY" \
              --body "$INSTANCE_IP"

            # Read it back and verify it matches.
            SAVED_IP="$(gh variable get EC2_HOST --repo "$REPOSITORY")"

            if [[ "$SAVED_IP" != "$INSTANCE_IP" ]]; then
              echo "ERROR: EC2_HOST does not match Terraform output."
              echo "Terraform IP: $INSTANCE_IP"
              echo "Saved IP: $SAVED_IP"
              exit 1
            fi

            echo "Verified EC2_HOST matches Terraform output: $SAVED_IP"

          else
            echo "Infrastructure destroyed. Removing EC2_HOST..."

            if gh variable delete EC2_HOST --repo "$REPOSITORY"; then
              echo "EC2_HOST removed."
            else
              echo "EC2_HOST may already be absent."
            fi
          fi
