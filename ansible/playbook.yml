
---
- name: Configure Ubuntu Server and deploy Bloomy project
  hosts: webservers
  become: true

  vars:
    repo_url: "https://github.com/chimuanyavic7/Bloomy-project.git"
    repo_dest: "/home/ubuntu/Bloomy-project"

    # Docker Hub credentials from GitHub Actions
    dockerhub_username: "{{ lookup('env', 'DOCKERHUB_USERNAME') }}"
    dockerhub_token: "{{ lookup('env', 'DOCKERHUB_TOKEN') }}"

    dockerhub_api: "https://hub.docker.com/v2/repositories"
    dockerhub_java_repo: "bloomy-java"
    dockerhub_portfolio_repo: "bloomy-myportfolio"

  tasks:

    # ==========================================
    # 1. UPDATE SYSTEM AND INSTALL PREREQUISITES
    # ==========================================

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install core prerequisites
      ansible.builtin.apt:
        name:
          - git
          - curl
          - unzip
          - ca-certificates
          - gnupg
        state: present

    # ==========================================
    # 2. INSTALL AWS CLI V2
    # ==========================================

    - name: Download AWS CLI v2 installer
      ansible.builtin.get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: "0644"

    - name: Extract AWS CLI installer
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true

    - name: Install AWS CLI v2
      ansible.builtin.command:
        cmd: /tmp/aws/install --update
      changed_when: false

    # ==========================================
    # 3. INSTALL DOCKER AND DOCKER COMPOSE
    # ==========================================

    - name: Ensure APT keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker stable repository
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components:
          - stable
        architectures:
          - amd64
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker Engine and plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - docker-buildx-plugin
        state: present
        update_cache: true

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    # ==========================================
    # 4. VALIDATE DOCKER HUB CREDENTIALS
    # ==========================================

    - name: Validate Docker Hub credentials
      ansible.builtin.assert:
        that:
          - dockerhub_username | length > 0
          - dockerhub_token | length > 0
        fail_msg: >
          Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN
          environment variable in GitHub Actions.

    # ==========================================
    # 5. AUTHENTICATE WITH DOCKER HUB
    # ==========================================

    - name: Login to Docker Hub
      ansible.builtin.command:
        argv:
          - docker
          - login
          - --username
          - "{{ dockerhub_username }}"
          - --password-stdin
        stdin: "{{ dockerhub_token }}"
      no_log: true

    # ==========================================
    # 6. RETRIEVE DOCKER HUB IMAGE TAGS
    # ==========================================

    - name: Get Docker Hub Java image tags
      ansible.builtin.uri:
        url: "{{ dockerhub_api }}/{{ dockerhub_username }}/{{ dockerhub_java_repo }}/tags?page_size=100&ordering=last_updated"
        method: GET
        return_content: true
        status_code: 200
      register: java_tags

    - name: Filter Java image Git SHA tags
      ansible.builtin.set_fact:
        java_sha_tags: >-
          {{
            java_tags.json.results
            | map(attribute='name')
            | select('match', '^[0-9a-f]{40}$')
            | list
          }}

    - name: Ensure Java SHA tags exist
      ansible.builtin.assert:
        that:
          - java_sha_tags | length > 0
        fail_msg: >
          No 40-character Git SHA tags found
          in the bloomy-java Docker Hub repository.

    # ==========================================
    # 7. FIND MATCHING PORTFOLIO IMAGE TAG
    # ==========================================

    - name: Check matching myportfolio image tags
      ansible.builtin.uri:
        url: "{{ dockerhub_api }}/{{ dockerhub_username }}/{{ dockerhub_portfolio_repo }}/tags/{{ item }}"
        method: GET
        status_code:
          - 200
          - 404
      loop: "{{ java_sha_tags }}"
      register: portfolio_tag_checks

    - name: Select latest common image SHA
      ansible.builtin.set_fact:
        image_tag: >-
          {{
            (
              portfolio_tag_checks.results
              | selectattr('status', 'equalto', 200)
              | map(attribute='item')
              | list
              | first
            ) | default('')
          }}

    - name: Validate matching Docker images
      ansible.builtin.assert:
        that:
          - image_tag | length == 40
        fail_msg: >
          No common Git SHA tag found in both
          bloomy-java and bloomy-myportfolio repositories.

    - name: Display selected image tag
      ansible.builtin.debug:
        msg: "Selected Bloomy deployment SHA: {{ image_tag }}"

    # ==========================================
    # 8. CLONE / UPDATE BLOOMY REPOSITORY
    # ==========================================

    - name: Clone repository at the selected Git SHA
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: "{{ image_tag }}"
        update: true
        force: true
      become_user: ubuntu

    - name: Ensure repository ownership
      ansible.builtin.file:
        path: "{{ repo_dest }}"
        owner: ubuntu
        group: ubuntu
        recurse: true
        state: directory

    # ==========================================
    # 9. VALIDATE DOCKER COMPOSE CONFIGURATION
    # ==========================================

    - name: Validate Docker Compose configuration
      ansible.builtin.command:
        cmd: docker compose config -q
        chdir: "{{ repo_dest }}"
      environment:
        DOCKERHUB_USERNAME: "{{ dockerhub_username }}"
        IMAGE_TAG: "{{ image_tag }}"

    # ==========================================
    # 10. PULL AND DEPLOY BLOOMY CONTAINERS
    # ==========================================

    - name: Pull SHA-tagged Docker images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ repo_dest }}"
      environment:
        DOCKERHUB_USERNAME: "{{ dockerhub_username }}"
        IMAGE_TAG: "{{ image_tag }}"

    - name: Start Bloomy containers
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ repo_dest }}"
      environment:
        DOCKERHUB_USERNAME: "{{ dockerhub_username }}"
        IMAGE_TAG: "{{ image_tag }}"

    # ==========================================
    # 11. LOGOUT FROM DOCKER HUB
    # ==========================================

    - name: Logout from Docker Hub
      ansible.builtin.command:
        cmd: docker logout
      changed_when: false

    # ==========================================
    # 12. DEPLOYMENT SUCCESS
    # ==========================================

    - name: Deployment successful
      ansible.builtin.debug:
        msg:
          - "Bloomy deployment completed successfully."
          - "Docker Hub username: {{ dockerhub_username }}"
          - "Image SHA: {{ image_tag }}"
          - "Services: bloomy-java, bloomy-myportfolio"
